version: "3.8"

services:
  db:
    image: postgres:16-alpine
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-monitur}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monitur}
      POSTGRES_DB: ${POSTGRES_DB:-monitur}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app_network

  app:
    build: .
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-monitur}:${POSTGRES_PASSWORD:-monitur}@db:5432/${POSTGRES_DB:-monitur}
    depends_on:
      - db
    ports:
      - "${APP_PORT:-3000}:3000"
    networks:
      - app_network

volumes:
  db_data:

networks:
  app_network:
    driver: bridge